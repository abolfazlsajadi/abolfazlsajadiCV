# Deploys the static site to GitHub Pages.
# Content is rendered into static HTML before publishing the public artifact.
# Enable in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Minimum permissions required by deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a production deploy mid-flight
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install build tools
        run: npm ci --ignore-scripts --no-bin-links --no-audit --no-fund

      - name: Build static pages
        run: npm run build:site

      - name: Check content and links
        run: npm test

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
