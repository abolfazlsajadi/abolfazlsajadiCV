      - name: intro
        label: Supervision introduction
        type: text
        required: true
      - name: completed
        label: Completed bachelor’s theses
        type: object
        list:
          min: 1
          max: 100
          collapsible:
            collapsed: true
            summary: "{student} ({year})"
        fields:
          - name: student
            label: Student name
            type: string
            required: true
          - name: title
            label: Thesis title
            type: text
            required: true
          - name: year
            label: Completion year
            type: number
            required: true
      - name: ongoing
        label: Theses in progress
